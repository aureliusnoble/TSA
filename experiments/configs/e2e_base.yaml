# Base pipeline config for the end-to-end evaluation (experiments/eval_e2e.py).
# Copy of configs/example.yaml with all paths absolute. Row/column extraction
# point at the OLD deployed models; gen "new" reloads weights post-construction
# in eval_e2e.build_pipeline (the mean/std passed to DocUFCN.load are hardcoded
# in Pipeline._initialize_models, so a path swap here would be wrong).

models:
