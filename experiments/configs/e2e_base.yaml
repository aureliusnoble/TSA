  row_extraction: "/home/aurelius/Dropbox/Work/PhD/Projects/(TSA)Tables_des_Successions_et_Absences/Core/Code/Libraries/TSA/models/rows_full/model.pth"
  column_extraction: "/home/aurelius/Dropbox/Work/PhD/Projects/(TSA)Tables_des_Successions_et_Absences/Core/Code/Libraries/TSA/models/columns_full/model.pth"

directories:
